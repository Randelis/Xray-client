name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        default: 'v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.1" > /dev/null

      - name: Download Xray-core binaries
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          echo "Xray version: $XRAY_VER"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-android-arm64-v8a.zip" \
            -o /tmp/xray-arm64.zip
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-android-amd64.zip" \
            -o /tmp/xray-amd64.zip
          unzip -p /tmp/xray-arm64.zip xray > app/src/main/jniLibs/arm64-v8a/libxray.so
          unzip -p /tmp/xray-amd64.zip xray > app/src/main/jniLibs/x86_64/libxray.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Xray Client ${{ steps.tag.outputs.tag }}"
          body: |
            ## Install on Android

            1. Download **app-debug.apk** below
            2. On your phone: **Settings → Apps → Special app access → Install unknown apps**
               → allow your browser or Files app
            3. Open the downloaded APK and tap **Install**

            ---
            Built with Xray-core latest release. Architecture: arm64-v8a + x86_64.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
